<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Logo do Tem No SUS?: interrogação cujo ponto é um comprimido sulcado.
       As cores escuras valem para o ícone da aba quando o sistema está no modo escuro. -->
  <style>
    .traco { stroke: #0c326f; }
    .metade-a { fill: #1351b4; }
    .metade-b { fill: #dbe8fb; }
    .contorno { stroke: #1351b4; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #b4cff7; }
      .metade-a { fill: #6ea2f2; }
      .metade-b { fill: #2b3d57; }
      .contorno { stroke: #6ea2f2; }
    }
  </style>
  <path class="traco" d="M20 18a12 12 0 1 1 18 10.4c-3.4 2-6 4.2-6 8.6v2" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(-35 32 52)">
    <path class="metade-a" d="M32 44.5a7.5 7.5 0 0 0 0 15z"/>
    <path class="metade-b" d="M32 44.5a7.5 7.5 0 0 1 0 15z"/>
    <circle class="contorno" cx="32" cy="52" r="7.5" fill="none" stroke-width="2"/>
    <line class="contorno" x1="32" y1="44.5" x2="32" y2="59.5" stroke-width="2"/>
  </g>
</svg>
